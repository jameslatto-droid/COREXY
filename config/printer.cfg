#####################################################################
# CoreXY Klipper Configuration
# Modular configuration for easier maintenance
#####################################################################

# Web Interface
[include mainsail.cfg]

# Core Hardware & Motion
[include hardware.cfg]      # Steppers, drivers, MCU, board pins
[include tuning.cfg]        # Motion tuning, input shaper, firmware retraction
[include thermistors.cfg]   # Extruder, bed heater, temperature sensors
[include fans.cfg]          # Part cooling, hotend fan, controller fan
[include probe.cfg]         # BLTouch, bed mesh, leveling
[include advanced.cfg]      # Advanced features: exclude_object, arcs, skew

# Features & Utilities
[include system.cfg]        # System settings, virtual SD, force move
[include macro.cfg]         # Core print/operator macros
[include calibration.cfg]   # User-facing calibration wrappers
[include neopixel1.cfg]     # Top-light effects + unified LED status
[include menu.cfg]          # Mini12864 display, LEDs, calibration menu
[include timelapse.cfg]     # Timelapse support

# Legacy calibration UI/test-print macro files are intentionally retained
# in the repository for history but are no longer included in live Klipper:
#   calibration_ui.cfg
#   test_prints.cfg

