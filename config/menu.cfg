## menu conf

#####################################################################
# Display
#####################################################################

# Fysetc Mini 12864 LCD Display
[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
contrast: 63
encoder_pins: ^EXP2_5, ^EXP2_3
menu_reverse_navigation: False
click_pin: ^!EXP1_2
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2
menu_timeout: 60

[display_data _default_16x4 print_progress]
position: 2, 0
text:
    {% if printer["gcode_macro START_PRINT"].value|default(0, true) == 1 %}
        { "{:^10.0%}".format(printer.display_status.progress) }
    {% else %}
        ----------------
    {% endif %}

[display_data _default_16x4 progress_bar]
position: 2, 1
text:
    {% if printer["gcode_macro START_PRINT"].value|default(0, true) == 1 %}
        { draw_progress_bar(2, 0, 9, printer.display_status.progress) }
    {% endif %}

[display_data _default_16x4 printing_time]
position: 2, 10
text:
    {% if printer["gcode_macro START_PRINT"].value|default(0, true) == 1 %}
        {% set ptime = printer["gcode_macro M73"].r %}
        { "R%02d:%02d" % (ptime // 60, ptime % 60) }
    {% endif %}

#####################################################################
# Dynamic RGB LED Effects
#####################################################################

# Neopixel RGB in mini12864 display
[neopixel fysetc_mini12864]
pin: EXP1_6
chain_count: 3
color_order: RGB
initial_RED: 0.0
initial_GREEN: 0.8
initial_BLUE: 1.0

# LED Effects
[led_effect LED_Ready]
autostart: true
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    static 0 0 top (0.0, 0.8, 1.0)

[led_effect LED_Heating]
autostart: false
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    breathing 2 1 top (1.0, 0.3, 0.0)

[led_effect LED_Calibrating]
autostart: false
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    breathing 3 1 top (0.5, 0.0, 1.0)

[led_effect LED_Printing]
autostart: false
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    static 0 0 top (0.0, 1.0, 0.0)

[led_effect LED_FinishPrint]
autostart: false
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    strobe 1 1.5 add (1.0, 1.0, 1.0)
    static 0 0 top (0.0, 1.0, 0.0)

[led_effect LED_Probing]
autostart: false
frame_rate: 24
leds:
    neopixel:fysetc_mini12864
layers:
    breathing 2 1 top (0.0, 0.5, 1.0)

#####################################################################
# Menu Customization
#####################################################################

[menu __main __octoprint]
type: disabled

#####################################################################
# Calibration Menu
#####################################################################

[menu __main __calibration]
type: list
name: Calibration
enable: {not printer.idle_timeout.state == "Printing"}

[menu __main __calibration __zoffset]
type: command
name: Z-Offset
gcode:
    CAL_Z_OFFSET

[menu __main __calibration __bedmesh]
type: command
name: Bed Mesh
gcode:
    G28
    M190 S50
    BED_MESH_CALIBRATE
    SAVE_CONFIG

#####################################################################
# Corner Level Menu
#####################################################################

[menu __main __setup __levelcorners]
type: list
enable: {not printer.idle_timeout.state == "Printing"}
name: Level Corners

[menu __main __setup __levelcorners __start]
type: command
name: Start Calibration
gcode:
    G28
    BED_SCREWS_ADJUST

[menu __main __setup __levelcorners __adjusted]
type: command
name: Adjusted
gcode:
    ADJUSTED

[menu __main __setup __levelcorners __accept]
type: command
name: Accept
gcode:
    ACCEPT

[menu __main __setup __levelcorners __abort]
type: command
name: Abort
gcode:
    G0 Z5
    ABORT
    G28

[menu __main __setup __levelcorners __home]
type: command
name: Home
gcode:
    G0 Z5
    G28
