#####################################################################
# Core Calibration Macros
#
# These are the only user-facing calibration wrappers. They deliberately
# do not auto-home, heat, save, restart, or move an individual Z motor.
# Each wrapper maps directly to the corresponding Klipper calibration
# command and coordinates the printer LEDs while that operation runs.
#####################################################################

[gcode_macro CAL_Z_OFFSET]
description: Z Probe Calibrate (PROBE_CALIBRATE)
gcode:
    _LED_STATUS STATE=CALIBRATING
    PROBE_CALIBRATE

[gcode_macro CAL_SCREWS_TILT]
description: Screws Tilt (SCREWS_TILT_CALCULATE)
gcode:
    _LED_STATUS STATE=PROBING
    SCREWS_TILT_CALCULATE
    _LED_STATUS STATE=READY

[gcode_macro CAL_BED_MESH]
description: Bed Mesh (BED_MESH_CALIBRATE)
gcode:
    _LED_STATUS STATE=PROBING
    BED_MESH_CALIBRATE
    _LED_STATUS STATE=READY

[gcode_macro CAL_SAVE]
description: Save calibration and restart Klipper
gcode:
    SAVE_CONFIG
