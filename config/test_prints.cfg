#####################################################################
# Test Print Macros - Standard Calibration Prints
#####################################################################

[gcode_macro TEST_PRINT_INFO]
description: 📋 Show standard test print recommendations
gcode:
    {action_respond_info("")}
    {action_respond_info("╔═══════════════════════════════════════════════════╗")}
    {action_respond_info("║                                                   ║")}
    {action_respond_info("║         STANDARD TEST PRINTS                      ║")}
    {action_respond_info("║                                                   ║")}
    {action_respond_info("╚═══════════════════════════════════════════════════╝")}
    {action_respond_info("")}
    {action_respond_info("📁 CALIBRATION PRINT DIRECTORY:")}
    {action_respond_info("   ~/printer_data/gcodes/calibration_prints/")}
    {action_respond_info("")}
    {action_respond_info("🧪 RECOMMENDED TEST SUITE:")}
    {action_respond_info("")}
    {action_respond_info("1️⃣  FIRST LAYER TEST (5 minutes)")}
    {action_respond_info("   → 5 squares to verify Z-offset")}
    {action_respond_info("   → Run after CAL_Z_OFFSET adjustments")}
    {action_respond_info("")}
    {action_respond_info("2️⃣  BED LEVEL TEST (10 minutes)")}
    {action_respond_info("   → Large first layer pattern")}
    {action_respond_info("   → Verify bed mesh accuracy")}
    {action_respond_info("")}
    {action_respond_info("3️⃣  XYZ CALIBRATION CUBE (15 minutes)")}
    {action_respond_info("   → 20mm cube, measure with calipers")}
    {action_respond_info("   → Should be 20.00mm ± 0.1mm")}
    {action_respond_info("")}
    {action_respond_info("4️⃣  TEMPERATURE TOWER (2 hours)")}
    {action_respond_info("   → Find optimal temp for filament")}
    {action_respond_info("   → Note best temp for bridging/overhangs")}
    {action_respond_info("")}
    {action_respond_info("5️⃣  RETRACTION TEST (1 hour)")}
    {action_respond_info("   → Eliminate stringing")}
    {action_respond_info("   → Current: 0.6mm @ 40mm/s")}
    {action_respond_info("")}
    {action_respond_info("6️⃣  3D BENCHY (2 hours)")}
    {action_respond_info("   → Universal benchmark")}
    {action_respond_info("   → Compare with community results")}
    {action_respond_info("")}
    {action_respond_info("💡 Access all test prints:")}
    {action_respond_info("   http://192.168.1.203/calibration.html")}
    {action_respond_info("")}

[gcode_macro PRESSURE_ADVANCE_TOWER]
description: 🧪 Generate Klipper pressure advance tuning pattern
gcode:
    {action_respond_info("═══════════════════════════════════════")}
    {action_respond_info("  PRESSURE ADVANCE CALIBRATION")}
    {action_respond_info("═══════════════════════════════════════")}
    {action_respond_info("")}
    {action_respond_info("1. Print a simple square/tower STL")}
    {action_respond_info("2. Add to your slicer start G-code:")}
    {action_respond_info("")}
    {action_respond_info("   TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE")}
    {action_respond_info("   PARAMETER=ADVANCE START=0 FACTOR=.005")}
    {action_respond_info("")}
    {action_respond_info("3. Print and examine each layer")}
    {action_respond_info("4. Measure best layer height × 0.005")}
    {action_respond_info("5. Set in printer.cfg:")}
    {action_respond_info("   pressure_advance: <calculated value>")}
    {action_respond_info("")}
    {action_respond_info("Current PA: %.3f" % printer.configfile.settings.extruder.pressure_advance)}
    {action_respond_info("Current smooth time: %.3f" % printer.configfile.settings.extruder.pressure_advance_smooth_time)}
    {action_respond_info("")}

[gcode_macro LOAD_CALIBRATION_PRINT]
description: 📂 List available calibration test prints
gcode:
    {action_respond_info("")}
    {action_respond_info("📁 Calibration Prints Directory:")}
    {action_respond_info("   ~/printer_data/gcodes/calibration_prints/")}
    {action_respond_info("")}
    {action_respond_info("Access via Mainsail → G-Code Files → calibration_prints")}
    {action_respond_info("")}
    {action_respond_info("💡 Download standard tests from:")}
    {action_respond_info("   http://192.168.1.203/calibration.html")}
    {action_respond_info("")}

[gcode_macro FIRST_LAYER_PREP]
description: 🎯 Prepare for first layer test print
gcode:
    {action_respond_info("═══════════════════════════════════════")}
    {action_respond_info("  FIRST LAYER TEST PREPARATION")}
    {action_respond_info("═══════════════════════════════════════")}
    
    # Home if not homed
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_respond_info("Homing all axes...")}
        G28
    {% endif %}
    
    # Load bed mesh
    {% if printer.bed_mesh.profile_name %}
        {action_respond_info("Bed mesh already loaded: %s" % printer.bed_mesh.profile_name)}
    {% else %}
        {action_respond_info("Loading default bed mesh...")}
        BED_MESH_PROFILE LOAD=default
    {% endif %}
    
    # Heat bed only for first layer test
    {action_respond_info("Heating bed to 60°C for first layer test...")}
    M140 S60
    M190 S60
    
    {action_respond_info("")}
    {action_respond_info("✓ Ready for first layer test print")}
    {action_respond_info("")}
    {action_respond_info("What to check:")}
    {action_respond_info("  • Squish: Lines should slightly merge")}
    {action_respond_info("  • Adhesion: Should stick well")}
    {action_respond_info("  • Uniformity: Even across all squares")}
    {action_respond_info("")}
    {action_respond_info("If not perfect, adjust Z-offset and retest")}
    {action_respond_info("")}

[gcode_macro BENCHMARK_SETTINGS]
description: 📊 Show current printer settings for benchmarking
gcode:
    {% set pa = printer.configfile.settings.extruder.pressure_advance %}
    {% set retract_length = printer.configfile.settings.firmware_retraction.retract_length %}
    {% set retract_speed = printer.configfile.settings.firmware_retraction.retract_speed %}
    {% set z_offset = printer.configfile.settings.bltouch.z_offset %}
    
    {action_respond_info("")}
    {action_respond_info("╔═══════════════════════════════════════════════════╗")}
    {action_respond_info("║                                                   ║")}
    {action_respond_info("║         CURRENT BENCHMARK SETTINGS                ║")}
    {action_respond_info("║                                                   ║")}
    {action_respond_info("╚═══════════════════════════════════════════════════╝")}
    {action_respond_info("")}
    {action_respond_info("📏 Z-OFFSET:")}
    {action_respond_info("   %.3f mm" % z_offset)}
    {action_respond_info("")}
    {action_respond_info("🔄 RETRACTION:")}
    {action_respond_info("   Distance: %.1f mm" % retract_length)}
    {action_respond_info("   Speed: %.0f mm/s" % retract_speed)}
    {action_respond_info("")}
    {action_respond_info("💧 PRESSURE ADVANCE:")}
    {action_respond_info("   PA Value: %.3f" % pa)}
    {action_respond_info("")}
    {action_respond_info("📐 BED MESH:")}
    {% if printer.bed_mesh.profile_name %}
        {action_respond_info("   Active: %s" % printer.bed_mesh.profile_name)}
        {% if printer.bed_mesh.mesh_matrix %}
            {% set matrix = printer.bed_mesh.mesh_matrix %}
            {% set all_points = [] %}
            {% for row in matrix %}
                {% for point in row %}
                    {% set _ = all_points.append(point) %}
                {% endfor %}
            {% endfor %}
            {% set min_point = all_points | min %}
            {% set max_point = all_points | max %}
            {% set range = max_point - min_point %}
            {action_respond_info("   Range: %.3f mm" % range)}
        {% endif %}
    {% else %}
        {action_respond_info("   No mesh loaded")}
    {% endif %}
    {action_respond_info("")}
    {action_respond_info("🎯 MAX SPEEDS:")}
    {action_respond_info("   Velocity: %.0f mm/s" % printer.configfile.settings.printer.max_velocity)}
    {action_respond_info("   Accel: %.0f mm/s²" % printer.configfile.settings.printer.max_accel)}
    {action_respond_info("")}
    {action_respond_info("💡 Record these values with your test prints!")}
    {action_respond_info("")}
