#####################################################################
# Probe, Bed Mesh, and Leveling - LENIENT MODE
#####################################################################

[safe_z_home]
home_xy_position: 30,30
speed: 100
z_hop: 5
z_hop_speed: 4

[bltouch]
sensor_pin: ^PA2
control_pin: PA1
stow_on_each_sample: true
samples: 3
speed: 5
lift_speed: 4
pin_move_time: 0.4
sample_retract_dist: 5
samples_tolerance: 0.050
samples_tolerance_retries: 6
y_offset: -20
x_offset: -27

[bed_mesh]
speed: 150
horizontal_move_z: 10
mesh_min: 35,35
mesh_max: 270,270
probe_count: 7,7
fade_start: 0.5
fade_end: 5.0
mesh_pps: 2,2
algorithm: bicubic
bicubic_tension: 0.2
zero_reference_position: 150,150

[bed_screws]
screw1: 30,30
screw2: 270,30
screw3: 270,270
screw4: 30,270

[screws_tilt_adjust]
screw1: 57,50
screw1_name: front left screw
screw2: 297,50
screw2_name: front right screw
screw3: 297,290
screw3_name: rear right screw
screw4: 57,290
screw4_name: rear left screw
horizontal_move_z: 10
speed: 100
screw_thread: CW-M3

