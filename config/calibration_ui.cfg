#####################################################################
# CALIBRATION UI - Organized Macro Groups for Mainsail
#####################################################################
# This file organizes calibration macros into a clean hierarchy
# Mainsail will display these in alphabetical order
#####################################################################

[gcode_macro _CAL_HEADER]
description: ═══════════════════════════════════
gcode:
    {action_respond_info("")}

[gcode_macro _CAL_INFO]
description: ℹ️ Show calibration system help
gcode:
    {action_respond_info("")}
    {action_respond_info("╔═══════════════════════════════════════════════════╗")}
    {action_respond_info("║                                                   ║")}
    {action_respond_info("║         CALIBRATION SYSTEM GUIDE                  ║")}
    {action_respond_info("║                                                   ║")}
    {action_respond_info("╚═══════════════════════════════════════════════════╝")}
    {action_respond_info("")}
    {action_respond_info("📅 TYPICAL USAGE SCHEDULE:")}
    {action_respond_info("")}
    {action_respond_info("  MONTHLY:         Disabled while Z-Tilt is disabled")}
    {action_respond_info("")}
    {action_respond_info("  WEEKLY:          Disabled while Z-Tilt is disabled")}
    {action_respond_info("")}
    {action_respond_info("  AFTER HARDWARE:  Use the staged manual commissioning checklist")}
    {action_respond_info("")}
    {action_respond_info("  FIRST LAYER:     Run CAL_Z_OFFSET")}
    {action_respond_info("                   Fix squish issues")}
    {action_respond_info("                   Time: 5-7 minutes")}
    {action_respond_info("")}
    {action_respond_info("  AFTER CHANGES:   Run CAL_SAVE")}
    {action_respond_info("                   Save and restart Klipper")}
    {action_respond_info("                   Time: 5-10 seconds")}
    {action_respond_info("")}
    {action_respond_info("🌡️  Calibration temperatures: Bed 50°C, Extruder 100°C")}
    {action_respond_info("📏 Current Z offset: %.3f mm" % printer.configfile.settings.bltouch.z_offset)}
    {action_respond_info("")}
    {action_respond_info("💡 All CAL_ macros show detailed progress info")}
    {action_respond_info("💡 LED effects indicate status (red=probing, green=done)")}
    {action_respond_info("")}

[gcode_macro _CAL_STATUS]
description: 📊 Show current calibration status
gcode:
    {% set mesh_min = printer.configfile.settings.bed_mesh.mesh_min %}
    {% set mesh_max = printer.configfile.settings.bed_mesh.mesh_max %}
    {% set probe_count = printer.configfile.settings.bed_mesh.probe_count %}
    
    {action_respond_info("")}
    {action_respond_info("╔═══════════════════════════════════════════════════╗")}
    {action_respond_info("║         CALIBRATION STATUS                        ║")}
    {action_respond_info("╚═══════════════════════════════════════════════════╝")}
    {action_respond_info("")}
    {action_respond_info("🔧 HARDWARE CONFIGURATION:")}
    {action_respond_info("  Probe: BLTouch")}
    {action_respond_info("  Z-Tilt: Dual Z motors (2-point)")}
    {action_respond_info("  Bed size: 300x300mm")}
    {action_respond_info("")}
    {action_respond_info("📏 CURRENT SETTINGS:")}
    {action_respond_info("  Z offset: %.3f mm" % printer.configfile.settings.bltouch.z_offset)}
    {action_respond_info("  Mesh: %dx%d grid (%d points)" % (probe_count[0], probe_count[1], probe_count[0] * probe_count[1]))}
    {action_respond_info("  Mesh area: (%.0f,%.0f) to (%.0f,%.0f)" % (mesh_min[0], mesh_min[1], mesh_max[0], mesh_max[1]))}
    {action_respond_info("")}
    {% if printer.bed_mesh %}
        {% set mesh = printer.bed_mesh %}
        {% if mesh.profile_name %}
            {action_respond_info("🗺️  ACTIVE BED MESH:")}
            {action_respond_info("  Profile: %s" % mesh.profile_name)}
            {% if mesh.mesh_matrix %}
                {% set matrix = mesh.mesh_matrix %}
                {% set all_points = [] %}
                {% for row in matrix %}
                    {% for point in row %}
                        {% set _ = all_points.append(point) %}
                    {% endfor %}
                {% endfor %}
                {% set min_point = all_points | min %}
                {% set max_point = all_points | max %}
                {% set range = max_point - min_point %}
                {action_respond_info("  Range: %.3f mm (%.3f to %.3f)" % (range, min_point, max_point))}
                {% if range > 0.2 %}
                    {action_respond_info("  ⚠️  WARNING: Large mesh range (>0.2mm)")}
                    {action_respond_info("  → Consider checking bed screws")}
                {% elif range > 0.1 %}
                    {action_respond_info("  ⚠️  Moderate mesh range (>0.1mm)")}
                {% else %}
                    {action_respond_info("  ✓ Good mesh flatness (<0.1mm range)")}
                {% endif %}
            {% endif %}
        {% else %}
            {action_respond_info("🗺️  NO ACTIVE BED MESH")}
            {action_respond_info("  → Generate a fresh mesh after mechanical commissioning")}
        {% endif %}
    {% endif %}
    {action_respond_info("")}

[gcode_macro OPEN_CALIBRATION_CENTER]
description: 🌐 Open Calibration Center webpage
gcode:
    {action_respond_info("")}
    {action_respond_info("╔═══════════════════════════════════════════════════╗")}
    {action_respond_info("║                                                   ║")}
    {action_respond_info("║      🎯 CALIBRATION CENTER WEBPAGE 🎯             ║")}
    {action_respond_info("║                                                   ║")}
    {action_respond_info("╚═══════════════════════════════════════════════════╝")}
    {action_respond_info("")}
    {action_respond_info("Open in your browser:")}
    {action_respond_info("")}
    {action_respond_info("  📱 http://192.168.1.203/calibration.html")}
    {action_respond_info("")}
    {action_respond_info("Features:")}
    {action_respond_info("  ✓ Beautiful visual interface")}
    {action_respond_info("  ✓ Large, color-coded buttons")}
    {action_respond_info("  ✓ One-click macro execution")}
    {action_respond_info("  ✓ Works on desktop, tablet & mobile")}
    {action_respond_info("  ✓ Keyboard shortcuts")}
    {action_respond_info("")}
    {action_respond_info("💡 Tip: Bookmark it for quick access!")}
    {action_respond_info("")}
    M117 Open: 192.168.1.203/calibration.html
    RESPOND TYPE=command MSG="action:open_url http://192.168.1.203/calibration.html"
