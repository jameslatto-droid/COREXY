[led_effect panel_idle]
autostart:              true
frame_rate:             24
leds:
    neopixel:top_lights
layers:
     static     1 0 top (.1,.1,0)


[led_effect LED_Probing]
autostart:              false
frame_rate:             24
leds:
    neopixel:top_lights
layers:
    chase  2 50 top (1,0,0)

[led_effect LED_Heating]
autostart:              false
frame_rate:             24
leds:
    neopixel:top_lights
layers:
    breathing  10 1 top (1,0,0)

[led_effect LED_Printing]
autostart:              false
frame_rate:             24
leds:
    neopixel:top_lights
layers:
    gradient  0.3  1 add (0.3, 0.0, 0.0),(0.3, 0.3, 0.0),(0.3, 0.1, 0.0)

[led_effect LED_FinishPrint]
autostart:              false
frame_rate:             24
leds:
    neopixel:top_lights
layers:
    breathing  5 1 top (0,1,0)
