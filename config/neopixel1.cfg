#####################################################################
# Main Top-Light LED Effects
#
# The 60-LED top strip uses TOP_* effect names. The Mini12864 display
# LEDs are defined separately in menu.cfg. Unique names prevent Klipper's
# linear include parsing from merging effects that target different chains.
#####################################################################

[led_effect panel_idle]
autostart: true
frame_rate: 24
leds:
    neopixel:top_lights
layers:
    static 1 0 top (.1,.1,0)

[led_effect TOP_Heating]
autostart: false
frame_rate: 24
leds:
    neopixel:top_lights
layers:
    breathing 10 1 top (1,0,0)

[led_effect TOP_Probing]
autostart: false
frame_rate: 24
leds:
    neopixel:top_lights
layers:
    chase 2 50 top (1,0,0)

[led_effect TOP_Calibrating]
autostart: false
frame_rate: 24
leds:
    neopixel:top_lights
layers:
    breathing 3 1 top (0.5,0,1)

[led_effect TOP_Printing]
autostart: false
frame_rate: 24
leds:
    neopixel:top_lights
layers:
    gradient 0.3 1 add (0.3,0.0,0.0),(0.3,0.3,0.0),(0.3,0.1,0.0)

[led_effect TOP_Paused]
autostart: false
frame_rate: 24
leds:
    neopixel:top_lights
layers:
    breathing 4 1 top (1,0.35,0)

[led_effect TOP_FinishPrint]
autostart: false
frame_rate: 24
leds:
    neopixel:top_lights
layers:
    breathing 5 1 top (0,1,0)

[led_effect TOP_Cancelled]
autostart: false
frame_rate: 24
leds:
    neopixel:top_lights
layers:
    breathing 2.5 1 top (1,0,0)

#####################################################################
# Unified LED Status Control
#
# Each state deliberately starts one effect on the top strip and one on
# the Mini12864. REPLACE=1 only replaces effects that share the same LEDs,
# so the two independently-addressed chains remain active together.
#####################################################################

[gcode_macro _LED_STATUS]
description: Set coordinated top-strip and LCD LED status
gcode:
    {% set state = params.STATE|default("READY")|upper %}

    {% if state == "READY" or state == "IDLE" %}
        SET_LED_EFFECT EFFECT=panel_idle REPLACE=1
        SET_LED_EFFECT EFFECT=LED_Ready REPLACE=1
    {% elif state == "HEATING" %}
        SET_LED_EFFECT EFFECT=TOP_Heating REPLACE=1
        SET_LED_EFFECT EFFECT=LED_Heating REPLACE=1
    {% elif state == "PROBING" %}
        SET_LED_EFFECT EFFECT=TOP_Probing REPLACE=1
        SET_LED_EFFECT EFFECT=LED_Probing REPLACE=1
    {% elif state == "CALIBRATING" %}
        SET_LED_EFFECT EFFECT=TOP_Calibrating REPLACE=1
        SET_LED_EFFECT EFFECT=LED_Calibrating REPLACE=1
    {% elif state == "PRINTING" %}
        SET_LED_EFFECT EFFECT=TOP_Printing REPLACE=1
        SET_LED_EFFECT EFFECT=LED_Printing REPLACE=1
    {% elif state == "PAUSED" %}
        SET_LED_EFFECT EFFECT=TOP_Paused REPLACE=1
        SET_LED_EFFECT EFFECT=LED_Paused REPLACE=1
    {% elif state == "FINISHED" %}
        SET_LED_EFFECT EFFECT=TOP_FinishPrint REPLACE=1
        SET_LED_EFFECT EFFECT=LED_FinishPrint REPLACE=1
    {% elif state == "CANCELLED" %}
        SET_LED_EFFECT EFFECT=TOP_Cancelled REPLACE=1
        SET_LED_EFFECT EFFECT=LED_Cancelled REPLACE=1
    {% else %}
        {action_raise_error("Unknown LED status: %s" % state)}
    {% endif %}
