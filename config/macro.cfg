#####################################################################
# Macros
#####################################################################

[delayed_gcode INIT_PRINTER]
initial_duration: 1
gcode:
    READY


[gcode_macro Mesh]
gcode:
  RESPOND MSG="🧹 Clearing old mesh..."
  BED_MESH_CLEAR
  
  RESPOND MSG="🏠 Homing..."
  G28
  
  RESPOND MSG="🔥 Heating bed to 50°C and nozzle to 100°C..."
  M140 S50
  M104 S100
  M190 S50
  M109 S100
  
  RESPOND MSG="⏱️ Soaking for 2 minutes..."
  G4 P120000
  
  RESPOND MSG="🔍 Starting bed mesh calibration..."
  SET_LED_EFFECT EFFECT=LED_Probing REPLACE=1
  BED_MESH_CALIBRATE
  
  RESPOND MSG="💾 Saving configuration..."
  SAVE_CONFIG


[gcode_macro READY]
gcode:
  M117 Printer Ready

  
[gcode_macro START_PRINT]
gcode:
    # Clear any previous offsets and mesh
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    
    SET_LED_EFFECT EFFECT=LED_Heating REPLACE=1  
    {% set BED = params.BED|default(50)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(200)|float %}
    
    # Start bed heating
    M140 S{BED}
    
    # Home the printer
    G28
    
    # Move the nozzle near the bed
    G1 Z5 F3000
    
    # Load saved bed mesh
    BED_MESH_PROFILE LOAD=default
    
    # Wait for bed to reach temperature
    M190 S{BED}
   
    # Move the nozzle very close to the bed
    G1 Z5 F3000
    SET_LED_EFFECT EFFECT=LED_Heating REPLACE=1  
    M109 S{EXTRUDER}
    
    # Purge Line Gcode
    G92 E0
    G90
    G0 X2 Y2 F6000
    G0 Z0.2
    G91
    G1 X120 E10 F1200
    G1 Y3
    G1 X-120 E6 F1200
    G92 E0
    G90
    G1 Z5.0 F600
    G1 X10 Y10 F1200
    G92 E0
    G1 F9000
    M117 Printing...
    SET_LED_EFFECT EFFECT=LED_Printing REPLACE=1

# [gcode_macro CALIBRATE_SHAPER]
# gcode:
  # G28
  # SHAPER_CALIBRATE


# [gcode_macro ADJUST_SCREWS]
# gcode:
#   G28
#   ADJUST_SCREWS

[gcode_macro CALIBRATE_PROBE_Height]
gcode:
  G28
  G1 X50 Y50  
  PROBE_CALIBRATE




[gcode_macro END_PRINT]
gcode:
    # Turn off heaters
    M140 S0
    M104 S0
    M106 S0

    # Retract only (no XY yet)
    G91
    G1 E-3 F300

    # Lift Z safely
    G1 Z15 F3000

    # Now it's safe to move in XY
    G90
    G1 X150 Y150 F6000

    # Disable steppers
    M84

    M117 Finished...
    SET_LED_EFFECT EFFECT=LED_FinishPrint REPLACE=1

[gcode_macro STOP_PRINT]
gcode:
    END_PRINT


[gcode_macro ZUP]
gcode:
    SET_GCODE_OFFSET Z_ADJUST=0.025 MOVE=1

[gcode_macro ZDOWN]
gcode:
    SET_GCODE_OFFSET Z_ADJUST=-0.025 MOVE=1

[gcode_macro ZRESET]
gcode:
    SET_GCODE_OFFSET Z=0 MOVE=1

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
    ##### set defaults #####
    {% set x = params.X|default(295) %}      #edit to your park position
    {% set y = params.Y|default(295) %}      #edit to your park position
    {% set z = params.Z|default(10)|float %} #edit to your park position
    {% set e = params.E|default(1) %}        #edit to your retract length
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift_z = z|abs %}
    {% if act_z < (max_z - lift_z) %}
        {% set z_safe = lift_z %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{e} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
      G1 Z{z_safe}
      G90
      G1 X{x} Y{y} F6000
    {% else %}
      {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    ##### set defaults #####
    {% set e = params.E|default(1.5) %} #edit to your retract length
    #### get VELOCITY parameter if specified ####
    {% if 'VELOCITY' in params|upper %}
      {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
    {%else %}
      {% set get_params = "" %}
    {% endif %}
    ##### end of definitions #####
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E{e} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    END_PRINT
    CANCEL_PRINT_BASE


######################################################################
# Beeper
######################################################################

# M300 : Play tone. Beeper support, as commonly found on usual LCD
# displays (i.e. RepRapDiscount 2004 Smart Controller, RepRapDiscount
# 12864 Full Graphic). This defines a custom I/O pin and a custom
# GCODE macro.  Usage:
#   M300 [P<ms>] [S<Hz>]
#   P is the tone duration, S the tone frequency.
# The frequency won't be pitch perfect.
# Beeper
[output_pin beeper]
pin: PG4
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.0024


[gcode_macro M300]
gcode:
    # Use a default 1kHz tone if S is omitted.
    {% set S = params.S|default(1000)|int %}
    # Use a 10ms duration is P is omitted.
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0

